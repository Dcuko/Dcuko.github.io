name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # todo dia: atualiza o % de linguagens
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atualizar stack do GitHub
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: node scripts/stack.mjs || echo "Mantendo o stack.json anterior"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
